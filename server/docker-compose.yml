services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: arbor_sync
      POSTGRES_USER: arbor
      POSTGRES_PASSWORD: arbor
    ports:
      - "55432:5432"
    volumes:
      - arbor-sync-postgres-v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arbor -d arbor_sync"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  arbor-sync-postgres-v18:
