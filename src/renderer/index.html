<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: zotfile:; connect-src 'self' http: https: ws: wss: zotfile:; font-src 'self' data:; worker-src 'self' blob:;"
    />
    <meta name="theme-color" content="#faf6f1" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var savedTheme = localStorage.getItem('zotagent-theme')
        var savedDark = savedTheme === 'dark' || savedTheme === 'midnight'
        if (savedTheme) document.documentElement.dataset.theme = savedTheme
        if (savedDark) document.documentElement.dataset.dark = 'true'
        document.documentElement.style.colorScheme = savedDark ? 'dark' : 'light'
      } catch (error) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="./arbor-logo.svg" />
    <title>Arbor — 文献阅读与 AI 研究工坊</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
